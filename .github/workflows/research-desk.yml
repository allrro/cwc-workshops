name: Research Desk CI

on:
  push:
    paths:
      - 'research-desk/**'
      - '.github/workflows/research-desk.yml'
  pull_request:
    paths:
      - 'research-desk/**'
      - '.github/workflows/research-desk.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research-desk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: research-desk/package-lock.json
      - run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Type-check Research Desk
        run: npm run typecheck
