name: Workshop grader regressions

on:
  push:
    paths:
      - 'agent-decomposition/**'
      - 'eval-driven-agent-development/**'
      - '.github/workflows/grader-regressions.yml'
  pull_request:
    paths:
      - 'agent-decomposition/**'
      - 'eval-driven-agent-development/**'
      - '.github/workflows/grader-regressions.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-decomposition
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  pptx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eval-driven-agent-development
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eval-driven-agent-development/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify the real model fixture renders as five pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils
          soffice -env:UserInstallation=file://"$RUNNER_TEMP/lo" --headless --convert-to pdf --outdir "$RUNNER_TEMP" tests/fixtures/transformers.pptx
          test "$(pdfinfo "$RUNNER_TEMP/transformers.pdf" | awk '/^Pages:/ {print $2}')" = 5
