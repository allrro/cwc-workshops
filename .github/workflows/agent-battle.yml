name: Agent Battle event smoke

on:
  push:
    paths:
      - 'agent-battle/event/**'
      - '.github/workflows/agent-battle.yml'
  pull_request:
    paths:
      - 'agent-battle/event/**'
      - '.github/workflows/agent-battle.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-battle/event
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent-battle/event/package-lock.json
      - run: npm ci
      - run: npm test
